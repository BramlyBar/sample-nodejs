name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # Docker requires image names to be completely lowercase.
  IMAGE_NAME: bramlybar/sample-nodejs

jobs:
  # 1. SAST (Static Application Security Testing) & Dependency Scanning
  security-sast:
    name: Security Checks (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # OWASP-recommended SAST tool specifically for Node.js
      - name: Run njsscan (Node.js SAST)
        uses: ajinabraham/njsscan-action@master
        with:
          args: '. --exit-warning' # Fails the pipeline if critical/high vulnerabilities are found in code

      # Bonus: Check for hardcoded secrets
      - name: Run TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # 2. Build, Dockerize, and Container Vulnerability Scanning
  build-and-scan:
    name: Build & Scan Docker Image
    needs: security-sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image but don't push it yet (we need to scan it first)
      - name: Build Docker Image (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:test

      # Scan the built Docker image using Trivy
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:test'
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'             # Blocks deployment if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'  # Only fail on HIGH and CRITICAL

      - name: Upload Trivy Scan Results
        uses: actions/upload-artifact@v4
        if: always() # Ensure this runs even if the Trivy scan fails
        with:
          name: trivy-scan-results
          path: trivy-results.txt

      # If the scan passes, log in and push to the private registry (GHCR)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version Bumping (Using Git SHA for immutable tags)
      - name: Extract metadata for Docker
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=long

      - name: Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 3. GitOps Deployment Stage
  update-gitops-repo:
    name: Trigger ArgoCD Deployment
    needs: build-and-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: 'BramlyBar/sample-nodejs-gitops' # A separate repository for GitOps
          token: ${{ secrets.GITOPS_PAT }}
          path: 'gitops'

      - name: Update Helm Image Tag
        run: |
          cd gitops
          # Update the image tag in the values.yaml file to trigger ArgoCD sync
          sed -i 's/tag: .*/tag: "sha-${{ github.sha }}"/' chart/values.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "CD: Update image tag to sha-${{ github.sha }}"
          git push origin main
